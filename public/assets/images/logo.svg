<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Deep Gear Gradient -->
    <linearGradient id="gearGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#0f2963" />
    </linearGradient>

    <!-- Dynamic Flow Arrow Cyan Gradient -->
    <linearGradient id="flowCyan" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#00b4d8" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Reverse Arrow / Accent Gradient -->
    <linearGradient id="arrowAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Car Gradient -->
    <linearGradient id="carGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0c2340" />
      <stop offset="50%" stop-color="#1e40af" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <g transform="translate(0, -20)">
    <!-- Gear Element -->
    <g id="gear" transform="translate(400, 370)">
      <!-- Gear Teeth Group -->
      <g fill="url(#gearGrad)">
        <!-- 12 Teeth around circle -->
        <rect x="-24" y="-195" width="48" height="42" rx="6" />
        <rect x="-24" y="-195" width="48" height="42" rx="6" transform="rotate(30)" />
        <rect x="-24" y="-195" width="48" height="42" rx="6" transform="rotate(60)" />
        <rect x="-24" y="-195" width="48" height="42" rx="6" transform="rotate(90)" />
        <rect x="-24" y="-195" width="48" height="42" rx="6" transform="rotate(120)" />
        <rect x="-24" y="-195" width="48" height="42" rx="6" transform="rotate(150)" />
        <rect x="-24" y="-195" width="48" height="42" rx="6" transform="rotate(180)" />
        <rect x="-24" y="-195" width="48" height="42" rx="6" transform="rotate(210)" />
        <rect x="-24" y="-195" width="48" height="42" rx="6" transform="rotate(240)" />
        <rect x="-24" y="-195" width="48" height="42" rx="6" transform="rotate(270)" />
        <rect x="-24" y="-195" width="48" height="42" rx="6" transform="rotate(300)" />
        <rect x="-24" y="-195" width="48" height="42" rx="6" transform="rotate(330)" />
        <!-- Outer Gear Body Rim -->
        <circle cx="0" cy="0" r="170" fill="url(#gearGrad)" />
      </g>
      <!-- Gear Hollow Center -->
      <circle cx="0" cy="0" r="126" fill="#ffffff" />
      <circle cx="0" cy="0" r="114" fill="none" stroke="url(#gearGrad)" stroke-width="8" opacity="0.3" />
    </g>

    <!-- Upper Flow Arrow Sweeping Up-Right -->
    <path d="M 430 320 C 470 290 530 270 580 230" fill="none" stroke="url(#flowCyan)" stroke-width="26" stroke-linecap="round" />
    <!-- Arrowhead Top-Right -->
    <polygon points="560,195 620,225 565,265 575,235" fill="url(#flowCyan)" />

    <!-- Sleek Car Silhouette -->
    <g id="car" transform="translate(400, 360)">
      <!-- Car Body Solid Profile -->
      <path d="M -90 15 
               C -90 -25, -60 -55, 0 -60 
               C 60 -65, 120 -30, 160 -10 
               C 185 0, 205 10, 210 25
               C 210 35, 195 40, 185 40
               C 175 40, 165 20, 140 20
               C 115 20, 105 40, 90 40
               L -40 40
               C -50 25, -65 20, -75 20
               C -85 20, -90 35, -90 40
               Z" 
            fill="url(#carGrad)" />
      <!-- Car Window / Cabin (White cutout) -->
      <path d="M -50 10 
               C -50 -15, -30 -38, 5 -42 
               C 40 -45, 80 -25, 105 -5
               C 90 2, 70 8, 45 9
               L -50 10 Z" 
            fill="#ffffff" />
      <!-- Window Divider / Pillar -->
      <line x1="20" y1="-43" x2="22" y2="9" stroke="url(#carGrad)" stroke-width="5" />
      <!-- Wheel Wells & Wheels -->
      <circle cx="140" cy="30" r="22" fill="#0f2963" />
      <circle cx="140" cy="30" r="14" fill="#ffffff" />
      <circle cx="140" cy="30" r="8" fill="#0284c7" />
    </g>

    <!-- Lower Flow Arrow Swirling around Bottom-Left through Center -->
    <g id="flow-arrows">
      <!-- Outer swoosh sweep -->
      <path d="M 210 390 
               C 180 430 200 480 260 500
               C 330 520 400 470 440 440" 
            fill="none" stroke="url(#flowCyan)" stroke-width="24" stroke-linecap="round" />
      
      <!-- Inner return loop with Arrowhead pointing up-right into the car -->
      <path d="M 215 405
               C 230 460 300 495 380 465 
               C 415 450 445 425 460 410" 
            fill="none" stroke="#38bdf8" stroke-width="14" stroke-linecap="round" />
      
      <polygon points="435,390 485,415 435,438 448,415" fill="url(#flowCyan)" />
    </g>
  </g>

  <!-- Typography: AutoPartFlow ERP -->
  <g id="brand-text" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <text x="400" y="660" font-size="56" font-weight="800" letter-spacing="-1">
      <tspan fill="#0f2347">AutoPartFlow </tspan>
      <tspan fill="#00b4d8">ERP</tspan>
    </text>
  </g>
</svg>
